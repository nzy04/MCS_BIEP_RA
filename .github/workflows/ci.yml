name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - data/**
      - papers/**
      - assets/uploads/**
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm audit --audit-level high
      - run: pnpm build
      - run: pnpm exec wrangler deploy --dry-run --outdir test-results/review-bundle
      - run: node tests/review_runtime.mjs
      - run: node tests/workflow_runtime.mjs
      - run: node scripts/check-repository.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser workflows
        env:
          TEST_BASE_URL: http://127.0.0.1:5199/
          TEST_BROWSER_CHANNEL: ""
          PYTHONIOENCODING: utf-8
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 5199 > /tmp/paper-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5199/ > /dev/null && break; sleep 1; done
          python tests/run_browser.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workflow-failure-evidence
          path: test-results
          retention-days: 7
